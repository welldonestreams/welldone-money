name: Build desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm 11 withholds package install scripts pending approval, which
      # silently skips Electron's binary download and makes the build fail
      # later for an unrelated-looking reason. Node 22 ships npm 10.
      - run: npm ci

      - name: Test
        run: npm test

      # Regenerates build/icon.ico (gitignored) then builds the NSIS installer.
      - name: Build the installer
        run: npm run dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/WellDone-Money-Setup-*.exe
