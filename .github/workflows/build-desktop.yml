name: Build desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      # Actions are SHA-pinned because this workflow holds contents: write and
      # publishes an unsigned binary users download and execute. A mutable tag
      # here is a distribution risk, not just a build-integrity one.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm

      # npm 11 withholds package install scripts pending approval, which
      # silently skips Electron's binary download and makes the build fail
      # later for an unrelated-looking reason. Node 22 ships npm 10.
      - run: npm ci

      - name: Test
        run: npm test

      # Regenerates build/icon.ico (gitignored) then builds the NSIS installer.
      - name: Build the installer
        run: npm run dist

      # artifactName interpolates package.json's version, not the git tag. Fail
      # red on a drift instead of silently publishing a mislabelled installer.
      - name: Version must match tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: test -f "dist/WellDone-Money-Setup-${GITHUB_REF_NAME#v}.exe"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: dist/WellDone-Money-Setup-*.exe
